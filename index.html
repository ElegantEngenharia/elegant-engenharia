<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegant Engenharia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    color: #1a1a1a;
}

/* ===== HEADER ===== */

header {
    position: absolute;
    width: 100%;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,20,40,0.85);
    z-index: 10;
}

.logo img {
    height: 55px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 30px;
    font-weight: 500;
    transition: 0.3s;
}

nav a:hover {
    color: #d4af37;
}

.btn-top {
    background: #d4af37;
    padding: 8px 18px;
    border-radius: 5px;
}

/* ===== HERO ===== */

                url("images/hero.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
